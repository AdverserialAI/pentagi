name: Adverserial release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}
concurrency: {group: adverserial-release, cancel-in-progress: false}

env:
  IMAGE: us-central1-docker.pkg.dev/adverserial-ack-poc/agents/pentagi
  VERIFIER_URL: https://verify.adverserial.ai/verify
  WORKLOAD_IDENTITY_PROVIDER: projects/711745269151/locations/global/workloadIdentityPools/github-releases/providers/pentagi
  PUBLISHER: artex-release-publisher@adverserial-ack-poc.iam.gserviceaccount.com

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {contents: write, id-token: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain)"
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: google
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PUBLISHER }}
          token_format: access_token
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: {registry: us-central1-docker.pkg.dev, username: oauth2accesstoken, password: '${{ steps.google.outputs.access_token }}'}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            PACKAGE_VER=${{ steps.version.outputs.number }}
            PACKAGE_REV=
            PACKAGE_EDITION=ce
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:git-${{ github.sha }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
      - name: Sign and create release files
        env: {DIGEST: '${{ steps.build.outputs.digest }}'}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          digest=os.environ['DIGEST']; image=f"{os.environ['IMAGE']}@{digest}"
          ident=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/.github/workflows/release.yml@{os.environ['GITHUB_REF']}"
          data={'schema':'adverserial.agent-release/v1','product':'PentAGI','version':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'image':image,'platform':'linux/amd64','attestation':{'verifier_url':os.environ['VERIFIER_URL'],'cosign_oidc_issuer':'https://token.actions.githubusercontent.com','cosign_certificate_identity':ident}}
          Path('pentagi-release.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          Path('pentagi-image.env').write_text(f'PENTAGI_IMAGE={image}\n')
          PY
          sha256sum pentagi-release.json pentagi-image.env > SHA256SUMS
      - name: Publish GitHub release
        env: {GH_TOKEN: '${{ github.token }}', DIGEST: '${{ steps.build.outputs.digest }}'}
        run: |
          printf 'Digest-pinned confidential-runtime image: `%s@%s`\n' "$IMAGE" "$DIGEST" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "PentAGI $GITHUB_REF_NAME" --notes-file notes.md --verify-tag pentagi-release.json pentagi-image.env SHA256SUMS
